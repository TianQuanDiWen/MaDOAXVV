name: install

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "agent/**"
      - "go.mod"
      - "go.sum"
      - "build.config.json"
      - "build.ps1"
      - "tools/**"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "agent/**"
      - "go.mod"
      - "go.sum"
      - "build.config.json"
      - "build.ps1"
      - "tools/**"
      - "**.py"
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: build_config
        shell: bash
        run: |
          {
            echo "project_name=$(jq -r '.projectName' build.config.json)"
            echo "targets=$(jq -c '.targets' build.config.json)"
            echo "maafw_repository=$(jq -r '.dependencies.maaFramework.repository' build.config.json)"
            echo "maafw_release=$(jq -r '.dependencies.maaFramework.release' build.config.json)"
            echo "maafw_asset_template=$(jq -r '.dependencies.maaFramework.assetPattern' build.config.json)"
            echo "mxu_repository=$(jq -r '.dependencies.mxu.repository' build.config.json)"
            echo "mxu_release=$(jq -r '.dependencies.mxu.release' build.config.json)"
            echo "mxu_asset_template=$(jq -r '.dependencies.mxu.assetPattern' build.config.json)"
            echo "python_version=$(jq -r '.toolchain.pythonVersion' build.config.json)"
            echo "go_version=$(jq -r '.toolchain.goVersion' build.config.json)"
            echo "uv_index=$(jq -r '.toolchain.uvIndex' build.config.json)"
            echo "output_directory=$(jq -r '.directories.output' build.config.json)"
            echo "dependencies_directory=$(jq -r '.directories.dependencies' build.config.json)"
            echo "downloads_directory=$(jq -r '.directories.downloads' build.config.json)"
            echo "package_template=$(jq -r '.packageName' build.config.json)"
          } >> "$GITHUB_OUTPUT"
      - id: set_tag
        run: |
          # 检查标签格式
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi

          if ! $($is_release) ; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi

          # 检查是否为预发布版本
          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
            echo "This is a pre-release version"
          fi

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}
      project_name: ${{ steps.build_config.outputs.project_name }}
      targets: ${{ steps.build_config.outputs.targets }}
      maafw_repository: ${{ steps.build_config.outputs.maafw_repository }}
      maafw_release: ${{ steps.build_config.outputs.maafw_release }}
      maafw_asset_template: ${{ steps.build_config.outputs.maafw_asset_template }}
      mxu_repository: ${{ steps.build_config.outputs.mxu_repository }}
      mxu_release: ${{ steps.build_config.outputs.mxu_release }}
      mxu_asset_template: ${{ steps.build_config.outputs.mxu_asset_template }}
      python_version: ${{ steps.build_config.outputs.python_version }}
      go_version: ${{ steps.build_config.outputs.go_version }}
      uv_index: ${{ steps.build_config.outputs.uv_index }}
      output_directory: ${{ steps.build_config.outputs.output_directory }}
      dependencies_directory: ${{ steps.build_config.outputs.dependencies_directory }}
      downloads_directory: ${{ steps.build_config.outputs.downloads_directory }}
      package_template: ${{ steps.build_config.outputs.package_template }}

  install:
    needs: meta
    strategy:
      matrix:
        include: ${{ fromJSON(needs.meta.outputs.targets) }}
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Resolve configured artifact names
        id: build_names
        shell: bash
        run: |
          maafw_asset='${{ needs.meta.outputs.maafw_asset_template }}'
          maafw_asset="${maafw_asset//\{platform\}/${{ matrix.platform }}}"
          maafw_asset="${maafw_asset//\{arch\}/${{ matrix.arch }}}"

          mxu_asset='${{ needs.meta.outputs.mxu_asset_template }}'
          mxu_asset="${mxu_asset//\{platform\}/${{ matrix.platform }}}"
          mxu_asset="${mxu_asset//\{arch\}/${{ matrix.arch }}}"

          package_name='${{ needs.meta.outputs.package_template }}'
          package_name="${package_name//\{project\}/${{ needs.meta.outputs.project_name }}}"
          package_name="${package_name//\{platform\}/${{ matrix.platform }}}"
          package_name="${package_name//\{arch\}/${{ matrix.arch }}}"
          package_name="${package_name//\{version\}/${{ needs.meta.outputs.tag }}}"

          echo "maafw_asset=$maafw_asset" >> "$GITHUB_OUTPUT"
          echo "mxu_asset=$mxu_asset" >> "$GITHUB_OUTPUT"
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: ${{ needs.meta.outputs.maafw_repository }}
          fileName: ${{ steps.build_names.outputs.maafw_asset }}
          latest: ${{ needs.meta.outputs.maafw_release == 'latest' }}
          tag: ${{ needs.meta.outputs.maafw_release != 'latest' && needs.meta.outputs.maafw_release || '' }}
          out-file-path: ${{ needs.meta.outputs.dependencies_directory }}
          extract: true

      - name: Download MXU
        id: download_mxu
        uses: robinraju/release-downloader@v1
        with:
          repository: ${{ needs.meta.outputs.mxu_repository }}
          fileName: ${{ steps.build_names.outputs.mxu_asset }}
          latest: ${{ needs.meta.outputs.mxu_release == 'latest' }}
          tag: ${{ needs.meta.outputs.mxu_release != 'latest' && needs.meta.outputs.mxu_release || '' }}
          out-file-path: ${{ needs.meta.outputs.downloads_directory }}/MXU
          extract: true

      - name: Clean up MXU archive
        shell: bash
        run: |
          ARCHIVE_FILE_PATH="${{ fromJson(steps.download_mxu.outputs.downloaded_files)[0] }}"
          rm -f "${ARCHIVE_FILE_PATH}"
          echo "Archive cleanup command executed for MXU."

      - name: Install uv
        uses: astral-sh/setup-uv@v7.5.0
        with:
          enable-cache: true

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.meta.outputs.go_version }}
          cache: true

      - name: Install
        shell: bash
        env:
          UV_INDEX: ${{ needs.meta.outputs.uv_index }}
        run: |
          uv run \
            --python "${{ needs.meta.outputs.python_version }}" \
            --with-requirements tools/requirements.txt \
            python tools/install.py \
            "${{ needs.meta.outputs.tag }}" \
            "${{ matrix.platform }}" \
            "${{ matrix.arch }}" \
            --config build.config.json

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_names.outputs.package_name }}
          path: ${{ needs.meta.outputs.output_directory }}

  changelog:
    name: Generate changelog
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          # 正式版：使用 tag-pattern 只匹配正式版标签，包含所有从上一个正式版以来的提交
          # 预发布版：正常生成，只包含从上一个标签以来的提交
          args: >-
            -vv --latest --strip header
            ${{ needs.meta.outputs.is_prerelease == 'false' && '--tag-pattern "^v[0-9]+\\.[0-9]+\\.[0-9]+$"' || '' }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, install, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets

      - run: |
          mkdir packages
          for dir in assets/*; do
            name=$(basename "$dir")
            (cd "$dir" && zip -r "../../packages/$name" .)
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          tag_name: ${{ needs.meta.outputs.tag }}
          body: ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}

        # Mirror酱为第三方分发服务，新项目默认关闭
        # 若有需要请联系 Mirror酱 开通，直接自行开启是无法使用的
        # https://mirrorchyan.com/
      - name: Trigger MirrorChyanUploading
        if: false
        # if: ${{ github.repository_owner == 'MaaXYZ' }}
        shell: bash
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release.yml -f tag=${{ needs.meta.outputs.tag }}
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note.yml -f tag=${{ needs.meta.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
